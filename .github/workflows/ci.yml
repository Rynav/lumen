name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: ./scripts/build.sh
