name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Public preview image (macOS 27 + Xcode 27). Move to macos-27 when GitHub
    # promotes it to GA. Kept in step with the dmg job so both use one SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app
        run: ./scripts/build.sh

  dmg:
    needs: test
    # Xcode 27 links the macOS 27 SDK, so macOS 26+ shows the current design
    # instead of the legacy appearance an older SDK build gets.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      # No Developer ID in CI, so release.sh takes its ad-hoc path.
      - name: Build disk image
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-dmg
          path: dist/Lumen.dmg
          if-no-files-found: error
